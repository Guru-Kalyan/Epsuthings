<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — EpsumThings Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --bg: #090b0f;
      --bg2: #0d1017;
      --card: #11141b;
      --border: #1c2030;
      --text: #dfe1e8;
      --text2: #8e93a6;
      --text3: #545a70;
      --accent: #e85018;
      --accent-light: #ff6b35;
      --accent-glow: #e8501825;
      --white: #fff;
      --font: 'Outfit', sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px
    }

    .auth-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5)
    }

    .auth-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 1.5rem;
      margin-bottom: 32px;
      justify-content: center
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #e85018, #ff6b35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      font-size: 1rem
    }

    .auth-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center
    }

    .auth-subtitle {
      font-size: 0.85rem;
      color: var(--text3);
      margin-bottom: 32px;
      text-align: center
    }

    .field {
      margin-bottom: 20px
    }

    .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text2);
      margin-bottom: 8px;
      letter-spacing: 0.02em
    }

    .field input {
      width: 100%;
      padding: 12px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-glow)
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-family: var(--font);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      margin-top: 10px
    }

    .btn-accent {
      background: linear-gradient(135deg, #e85018, #ff6b35);
      color: var(--white);
      box-shadow: 0 4px 15px var(--accent-glow)
    }

    .btn-accent:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 25px var(--accent-glow)
    }

    .auth-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text3)
    }

    .auth-footer a {
      color: var(--accent-light);
      text-decoration: none;
      font-weight: 600
    }

    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      margin-bottom: 20px;
      display: none;
      text-align: center;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .success-msg {
      background: rgba(34, 197, 94, 0.1);
      color: #22c55e;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      margin-bottom: 20px;
      display: none;
      text-align: center;
      border: 1px solid rgba(34, 197, 94, 0.2);
    }
  </style>
</head>

<body>

  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">ET</div>
      <span>EpsumThings</span>
    </div>
    <h2 class="auth-title">Create an account</h2>
    <p class="auth-subtitle">Join the EpsumThings admin community</p>

    <div id="errorMsg" class="error-msg"></div>
    <div id="successMsg" class="success-msg"></div>

    <form id="registerForm">
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="name@company.com" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-accent">Register</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login/">Sign In</a>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');

      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';

      if (password !== confirmPassword) {
        errorMsg.textContent = 'Passwords do not match';
        errorMsg.style.display = 'block';
        return;
      }

      try {
        const response = await fetch('/users/register/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (data.status === 'success') {
          successMsg.textContent = 'Registration successful! Redirecting to login...';
          successMsg.style.display = 'block';
          setTimeout(() => {
            window.location.href = '/login/';
          }, 2000);
        } else {
          errorMsg.textContent = data.msg || 'Registration failed';
          errorMsg.style.display = 'block';
        }
      } catch (error) {
        errorMsg.textContent = 'An error occurred. Please try again.';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>

</html>
