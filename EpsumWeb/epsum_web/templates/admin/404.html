<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>404 - Page Not Found | Django</title>
    <!-- Google Fonts & simple reset for clean baseline -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(145deg, #f8fafc 0%, #eef2f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #0f172a;
        }

        /* main card container – modern, soft, responsive */
        .error-container {
            max-width: 720px;
            width: 100%;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(0px);
            border-radius: 2.5rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.25), 0 4px 12px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .error-container:hover {
            box-shadow: 0 30px 55px -15px rgba(0, 0, 0, 0.3);
        }

        /* decorative header with subtle pattern */
        .error-graphic {
            background: linear-gradient(135deg, #0f2b3d 0%, #1a4a6f 100%);
            padding: 2rem 2rem 1rem 2rem;
            text-align: center;
            position: relative;
        }

        .error-graphic::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: linear-gradient(to top, rgba(255, 255, 255, 0.96), transparent);
            pointer-events: none;
        }

        /* 404 big number + animation */
        .glitch-wrapper {
            position: relative;
            display: inline-block;
        }

        .big-404 {
            font-size: 8rem;
            font-weight: 800;
            line-height: 1;
            color: white;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.02em;
            font-family: 'Inter', monospace;
            transition: all 0.2s;
        }

        @media (min-width: 540px) {
            .big-404 {
                font-size: 11rem;
            }
        }

        .error-sub {
            font-size: 1.2rem;
            font-weight: 500;
            background: rgba(255, 255, 240, 0.2);
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            color: #f1f9ff;
            margin-top: 0.5rem;
            letter-spacing: 0.3px;
        }

        /* content area */
        .error-content {
            padding: 2.5rem 2rem 3rem 2rem;
            text-align: center;
        }

        .error-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            background: linear-gradient(120deg, #1e293b, #2c3e50);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .error-message {
            font-size: 1rem;
            color: #334155;
            max-width: 450px;
            margin: 0 auto 1.2rem auto;
            line-height: 1.5;
        }

        .error-help {
            font-size: 0.9rem;
            color: #475569;
            background: #f1f5f9;
            padding: 0.75rem 1.25rem;
            border-radius: 60px;
            display: inline-block;
            margin: 1rem 0 1.5rem 0;
            backdrop-filter: blur(2px);
        }

        /* action buttons */
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-top: 0.75rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.8rem 1.8rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            font-family: inherit;
            background: #fff;
            color: #1e293b;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .btn-primary {
            background: #0f2b3d;
            color: white;
            border: none;
            box-shadow: 0 4px 8px rgba(15, 43, 61, 0.2);
        }

        .btn-primary:hover {
            background: #1a4a6f;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(15, 43, 61, 0.25);
        }

        .btn-outline:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
            transform: translateY(-2px);
        }

        /* small footer note — django ready */
        .django-note {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
            padding-top: 1.5rem;
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .django-note span {
            font-family: monospace;
            background: #f1f5f9;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
        }

        /* animated floating orb effect (subtle) */
        .orb-bg {
            position: absolute;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(255, 215, 150, 0.2) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            top: -40px;
            right: -20px;
        }

        .error-graphic {
            position: relative;
            overflow: hidden;
        }

        /* Mobile first fine tuning */
        @media (max-width: 480px) {
            .error-content {
                padding: 1.8rem 1.2rem 2rem;
            }

            .btn {
                padding: 0.6rem 1.4rem;
                font-size: 0.85rem;
            }

            .error-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="error-container">
        <div class="error-graphic">
            <div class="orb-bg"></div>
            <div class="glitch-wrapper">
                <div class="big-404">404</div>
            </div>
            <div class="error-sub">PAGE NOT FOUND</div>
        </div>
        <div class="error-content">
            <h1 class="error-title">Looks like you're lost</h1>
            <p class="error-message">
                The page you’re looking for doesn’t exist, has been moved, or is temporarily unavailable.
            </p>
            <div class="error-help">
                ⚡ But don’t worry — great content awaits on the other side.
            </div>
            <div class="action-buttons">
                <a href="/" class="btn btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12L12 3l9 9" />
                        <path d="M5 10v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" />
                        <path d="M12 16v-4" />
                    </svg>
                    Back to Home
                </a>
                <a href="#" class="btn btn-outline" id="reportIssueBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M12 8v4" />
                        <path d="M12 16h.01" />
                    </svg>
                    Report issue
                </a>
            </div>
            <div class="django-note">
                <span>⚙️ DJANGO INTEGRATION READY</span>
                <span>🔍 404 handler: custom_404.html</span>
            </div>
        </div>
    </div>

    <!-- tiny script for report issue demo + optional console logging (Django-friendly) -->
    <script>
        (function () {
            // Retrieve current URL path to help debugging (can be used for analytics or report)
            const currentLocation = window.location.href;
            const missingPath = window.location.pathname;

            // Optional: store in data attr for report modal if needed, but here simple alert
            const reportBtn = document.getElementById('reportIssueBtn');
            if (reportBtn) {
                reportBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    // This simulates a user-friendly report. In a real Django app,
                    // you could open a contact form, send logs, or redirect to a support page.
                    // For production, replace with actual report endpoint or modal.
                    const userConfirmed = confirm(
                        `📢 Report missing page\n\nPath: "${missingPath}"\nFull URL: ${currentLocation}\n\nWould you like to go to the contact page or copy this info?`
                    );
                    if (userConfirmed) {
                        // you can redirect to a Django contact/feedback URL (e.g., "/contact/?report=404&path=...")
                        // For demonstration we copy to clipboard and show success.
                        navigator.clipboard.writeText(`404 Error on: ${currentLocation}`).then(() => {
                            alert("✅ Error details copied to clipboard. Please share with support if needed.");
                        }).catch(() => {
                            alert("⚠️ Could not copy automatically, but you can manually email support.");
                        });
                    }
                });
            }

            // Optional: log 404 event to console (can be helpful for Django devs during debug)
            console.info(`[Django 404] Custom error page displayed. Requested path: "${missingPath}"`);
            // Add a tiny dynamic meta for CSRF friendly? Not needed but shows awareness.
            // If you ever need to add a global "report" via Django messages, it's ready.
        })();
    </script>
</body>

</html>
